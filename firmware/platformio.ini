; UniRemote firmware - PlatformIO project
;
; Pick the environment that matches your board:
;   pio run -e esp32dev      -t upload   ; classic ESP32 (ESP32-WROOM-32 / DevKitC / "ESP32 DEVKIT V1")
;   pio run -e esp32s3       -t upload   ; ESP32-S3 DevKitC-1
;   pio run -e esp32c3       -t upload   ; ESP32-C3 DevKitM-1 / SuperMini
;
; ESP32-S2 is NOT supported: it has no Bluetooth radio.
;
; GPIO defaults live in include/config.h. You can override them here with
; build flags (e.g. -DUR_DEFAULT_RX_PIN=14) or at runtime with the
; `set_config` command (stored in NVS, applied after reboot).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    sui77/rc-switch@2.6.4
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; NimBLE: we are a peripheral only, keep the stack small.
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    ; Most C3 boards (incl. "SuperMini") have no USB-UART chip: use native USB CDC.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
